[package]
name = "bioxus-viewer3d"
description = "3D viewer for glTF binaries: a pure page builder, and a Dioxus component that shows it in place"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file = "../../LICENSE"

[dependencies]
base64 = "0.22"
serde_json = "1"
dioxus = { workspace = true, optional = true }

[features]
default = ["component"]
# The Dioxus component. Without it the crate is the page builder only, with no UI dependency.
component = ["dep:dioxus"]

[dev-dependencies]
dioxus-ssr = "0.7"

[lints]
workspace = true
