<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --bg: #f6f6f4; --panel: #ffffffee; --text: #1d1d1b; --muted: #6b6b66; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #232321ee; --text: #ecece8; --muted: #9a9a94; }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, sans-serif; }
  canvas { display: block; }
  aside { position: fixed; top: 16px; left: 16px; max-width: calc(100vw - 32px);
    background: var(--panel); border-radius: 8px; padding: 12px 16px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; }
  #size { color: var(--muted); margin-top: 8px; font-variant-numeric: tabular-nums; }
</style>
<script type="importmap">
{ "imports": {
  "three": "__CDN__/build/three.module.js",
  "three/addons/": "__CDN__/examples/jsm/"
} }
</script>
</head>
<body>
<aside><h1>__TITLE__</h1><div id="parts"></div><div id="size"></div></aside>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const PARTS = __PARTS__;
const COLOURS = [0x3d6fb6, 0xc9772f, 0x4f9a64, 0xb04a5a, 0x7a5fb0, 0x2f9aa6, 0x9a8a3d];
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(1, 2, 3);
scene.add(sun);
const camera = new THREE.PerspectiveCamera(40, 1, 0.0001, 100);
const controls = new OrbitControls(camera, renderer.domElement);
const root = new THREE.Group();
root.rotation.x = -Math.PI / 2;  // parts are Z-up, Three.js is Y-up
scene.add(root);

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

function frame() {
  const box = new THREE.Box3().setFromObject(root);
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3());
  const centre = box.getCenter(new THREE.Vector3());
  const reach = Math.max(size.x, size.y, size.z);
  camera.position.copy(centre).add(new THREE.Vector3(0.9, 0.6, 1.2).multiplyScalar(reach));
  controls.target.copy(centre);
  const mm = (v) => (v * 1000).toFixed(1);  // glTF is in metres
  document.getElementById("size").textContent =
    `${mm(size.x)} × ${mm(size.z)} × ${mm(size.y)} mm`;  // width, height, depth
}

const loader = new GLTFLoader();
const list = document.getElementById("parts");
PARTS.forEach(([name, data], i) => {
  const bytes = Uint8Array.from(atob(data), (c) => c.charCodeAt(0));
  loader.parse(bytes.buffer, "", (gltf) => {
    const colour = COLOURS[i % COLOURS.length];
    gltf.scene.traverse((o) => {
      if (o.isMesh) o.material = new THREE.MeshStandardMaterial({ color: colour, roughness: 0.55 });
    });
    root.add(gltf.scene);
    const row = document.createElement("label");
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = true;
    box.onchange = () => { gltf.scene.visible = box.checked; };
    const swatch = document.createElement("span");
    swatch.className = "swatch";
    swatch.style.background = "#" + colour.toString(16).padStart(6, "0");
    row.append(box, swatch, document.createTextNode(name));
    list.append(row);
    frame();
  });
});

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
